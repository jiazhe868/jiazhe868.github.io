{# Focal-mechanism "beachball" used as the logo and favicon. #}
{% macro beachball(size=24) -%}
<svg viewBox="0 0 32 32" width="{{ size }}" height="{{ size }}" aria-hidden="true" focusable="false">
<circle cx="16" cy="16" r="14.2" fill="var(--surface)" stroke="currentColor" stroke-width="1.8"/>
<path d="M16 16 L16 1.8 A14.2 14.2 0 0 1 30.2 16 Z M16 16 L16 30.2 A14.2 14.2 0 0 1 1.8 16 Z" fill="var(--accent)" transform="rotate(-28 16 16)"/>
<circle cx="16" cy="16" r="14.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
</svg>
{%- endmacro %}
