# Newest first. `text` accepts Markdown.
- date: 2026-11-16
  text: >-
    Released [qwen-seis-posttrain](https://github.com/jiazhe868/qwen-seis-posttrain):
    SFT and multi-task RL of **Qwen3.5-9B** on 24 A100 GPUs with verl and Megatron,
    with every result and failure documented. [Write-up](/llm/#stage-3-post-training-qwen35-9b).
- date: 2026-11-16
  text: >-
    Released **SubMIT v3**, a fully automated subevent inversion pipeline that goes from
    downloaded waveforms to final figures. [Code](https://github.com/jiazhe868/SubMIT) ·
    [About](/submit/).
- date: 2026-10-29
  text: >-
    Released [nanoGPT-Seis](https://github.com/jiazhe868/nanogpt-seis) and
    [nanoGPT-Seis-Posttrain](https://github.com/jiazhe868/nanogpt-seis-posttrain): a 113M GPT
    pretrained from scratch on earthquake science, then post-trained with SFT and GRPO.
    [Write-up](/llm/).
- date: 2026-10-08
  text: >-
    **Sensoformer** code, weights, and training data are public on
    [GitHub](https://github.com/jiazhe868/Sensoformer) and
    [Hugging Face](https://huggingface.co/jiazhe868/sensoformer).
- date: 2026-05-05
  text: >-
    Our study of the **2025 Mw 8.8 Kamchatka earthquake**, led by PhD student Junpeng Li, is
    published in *Geophysical Research Letters*.
- date: 2026-01-29
  text: >-
    A 3D model of the Izu-Bonin-Mariana subduction zone that links slab dynamics to
    earthquakes, led by Yida Li, is published in *Earth and Planetary Science Letters*.
- date: 2026-01-12
  text: >-
    **Sensoformer**, a sim-to-real model for irregular sensor arrays, is on
    [arXiv](https://arxiv.org/abs/2601.06320).
- date: 2025-12-27
  text: >-
    Our method for measuring rupture directivity of small earthquakes from energy envelopes is
    published in *JGR: Solid Earth*.
- date: 2025-08-30
  text: >-
    Our study of the **2024 Mw 7.4 Calama earthquake** is published in *Nature Communications*
    and featured by [Jackson School of Geosciences News](https://www.jsg.utexas.edu/news/2025/09/researchers-discover-mechanism-that-can-ramp-up-magnitude-of-certain-earthquakes/).
- date: 2025-06-01
  text: >-
    Our study of how large deep earthquakes grow is published in *AGU Advances* and featured
    as an [*Eos* Editors' Highlight](https://eos.org/editor-highlights/shedding-light-on-the-mysteries-of-deep-earthquakes).
- date: 2024-08-01
  text: Joined the **University of Texas Institute for Geophysics** as a Research Assistant Professor.
