  - id: tonga2021
    themes: [deep, structure]
    event: The Tonga slab and a relic slab
    when: Tonga–Fiji · mantle flow models
    authors: "Liu, H., Gurnis, M., Leng, W., **Jia, Z.**, & Zhan, Z."
    year: 2021
    title: "Tonga slab morphology and stress variations controlled by a relic slab: Implications for deep earthquakes in the Tonga-Fiji region"
    venue: Geophysical Research Letters
    image: /assets/img/quakes/tonga2021-fig2.webp
    summary: >-
      About two-thirds of the world's deep earthquakes occur in the Tonga slab. Mantle flow models
      that follow the region's plate history show a relic slab from the Vanuatu trench colliding
      with the Tonga slab, folding over it, and steepening it, which reproduces the stresses seen
      in deep earthquakes. The models imply that the 2018 Fiji doublet broke warm slab rock, which
      supports local slab temperature as the control on deep ruptures.
    links:
      - {label: Paper, url: "https://doi.org/10.1029/2020GL091331"}
      - {label: PDF, url: /assets/pdf/Liu_et_al_Tonga_2021_GRL.pdf}

  - id: hawthorne2019
