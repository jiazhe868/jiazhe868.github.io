  - id: kamchatka2026
    themes: [large]
    event: 2025 Kamchatka megathrust earthquake
    when: Jul 2025 · Mw 8.8
    authors: "Li, J., & **Jia, Z.**"
    year: 2026
    title: "The 2025 Mw 8.8 Kamchatka megathrust: A rapid recurrence with complex heterogeneous rupture"
    venue: Geophysical Research Letters
    summary: >-
      A magnitude 8.8 earthquake struck off Kamchatka about 50 km from the start of the 1952
      magnitude 9.0 earthquake. Combining global seismic waves with tsunami records, PhD student
      Junpeng Li and I found that most slip was at moderate to greater depth in the southwest,
      where few earthquakes had occurred since 1952. Peak slip of about 14 m exceeds the roughly
      6 m of slip deficit built up since 1952, so the 2025 earthquake released a deeper patch that
      likely stayed locked in 1952.
    links:
      - {label: Paper, url: "https://doi.org/10.1029/2026GL121923"}

  - id: luding2026
    themes: [large, methods]
    event: 2022 Luding, China, earthquake
    when: Sep 2022 · Mw 6.6
    authors: "Han, H., Ni, S., Meng, Q., Gu, W., **Jia, Z.**, et al."
    year: 2026
    title: Complex double-event rupture of the 2022 Mw 6.6 Luding earthquake
    venue: Bulletin of the Seismological Society of America
    summary: >-
      Published depths of the deadliest earthquake in mainland China in eight years ranged from 2
      to 18.4 km. Regional data favor about 6 km and teleseismic data about 17 km. Both fit a
      two-subevent model: a larger shallow subevent at about 6 km and, 7 seconds later, a smaller
      one at about 17 km.
    links:
