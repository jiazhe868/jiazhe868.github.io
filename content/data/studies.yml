  - id: izubonin2026
    themes: [deep, structure]
    event: Slab dynamics and earthquakes in Izu-Bonin-Mariana
    when: 3D geodynamic model
    authors: "Li, Y., Ribe, N. M., & **Jia, Z.**"
    year: 2026
    title: "Large-scale slab dynamics as drivers of seismicity: Modeling earthquakes in the Izu-Bonin-Mariana subduction zones"
    venue: Earth and Planetary Science Letters
    summary: >-
      A 3D model of the sinking Pacific slab predicts temperature, stress, and energy dissipation.
      Earthquakes occur mostly in rock cooler than about 900 °C, where dissipation is high, and the
      modeled stresses explain megathrust, outer-rise, and deep bending earthquakes. Shallow events
      favor a weak slab and deep events a stronger slab with a 10 to 100 fold viscosity increase at
      660 km.
