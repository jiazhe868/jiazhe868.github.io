    venue: Seismological Research Letters
    image: /assets/img/quakes/gcapjoint2020-fig1.webp
    summary: >-
      About 10% of earthquakes in the Global CMT catalog have large non-double-couple components.
      gCAPjoint solves for the full moment tensor and depth by fitting local and teleseismic
