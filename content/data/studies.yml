    authors: "**Jia, Z.**, Ni, S., Chu, R., & Zhan, Z."
    year: 2017
    title: Joint inversion for earthquake depths using local waveforms and amplitude spectra of Rayleigh waves
    venue: Pure and Applied Geophysics
    image: /assets/img/quakes/depth2017-fig6a.webp
    summary: >-
      With few nearby stations, waveform fits can match almost equally well over a wide range of
      depths. Rayleigh waves recorded 5 to 15 degrees away have spectral dips that shift with source
      depth. Fitting them together with local waveforms gave depths of 8 km for the 2008 Wells,
      Nevada, earthquake and 32 km for a 2013 outer-rise earthquake off Japan, both confirmed by
      teleseismic depth phases.
