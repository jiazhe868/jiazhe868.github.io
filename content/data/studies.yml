    event: 2011 Hawthorne, Nevada, earthquake swarm
    when: Mar–Aug 2011 · Mw 3.9–4.8
    authors: "Zha, X., **Jia, Z.**, Dai, Z., & Lu, Z."
    year: 2019
    title: The cause of the 2011 Hawthorne (Nevada) earthquake swarm constrained by seismic and InSAR methods
    venue: Journal of Geodesy
    image: /assets/img/quakes/hawthorne2019-fig7.webp
    summary: >-
      A swarm of 71 earthquakes shook an area near a Navy base and young volcanic features.
      Waveform modeling put the nine largest at 2 to 4 km depth with normal faulting, and satellite
      radar showed up to 10 cm of slip at 1 to 2 km depth. The radar implies about 15% more slip
      than the earthquakes released, and the swarm likely came from slow fault slip under regional
      stretching, with no sign of volcanic activity.
