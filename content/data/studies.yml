    event: Deep learning for ambient-noise dispersion curves
    when: U-Net · Long Beach dense array
    authors: "Zhang, X., **Jia, Z.**, Ross, Z. E., & Clayton, R. W."
    year: 2020
    title: Extracting dispersion curves from ambient noise correlations using deep learning
    venue: IEEE Transactions on Geoscience and Remote Sensing
    image: /assets/img/quakes/dispersion2020-fig4.webp
    summary: >-
      Dense arrays produce thousands of dispersion images that analysts trace by hand. A U-Net
      trained on 100,000 synthetic curves and fine-tuned on 1,000 hand-labeled examples labels
      every pixel as fundamental mode, first overtone, or noise. On 4,340 held-out examples its
      picks match a human analyst's, with median precision of at least 98% and recall of at least
      94%, and it cuts human labor by about 80%.
